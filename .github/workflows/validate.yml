name: Validate SunOmega Knowledge
on:
  push:
  pull_request:
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Validate records and graph export
        run: |
          sunomega validate
          python -m unittest discover -s tests -v
          sunomega export-metta > sunomega.generated.metta
          test -s sunomega.generated.metta

  atomspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hyperon adapter
        run: python -m pip install -e ".[atomspace]"
      - name: Load and query real AtomSpace
        run: sunomega smoke-metta

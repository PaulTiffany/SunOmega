[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunomega"
version = "0.1.0"
description = "Agent-first Suno production knowledge and AtomSpace projection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Paul Carver Tiffany III" }]
dependencies = []

[project.optional-dependencies]
atomspace = ["hyperon==0.2.10"]
midi = ["mido>=1.3,<2", "pretty_midi>=0.2.10,<1"]
audio = ["numpy>=2,<3", "librosa>=0.11,<1", "soundfile>=0.13,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
sunomega = "sunomega.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
